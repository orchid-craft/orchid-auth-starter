services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchid-auth-starter
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      # Secret TIDAK boleh ditulis di file ini. Suplai dari environment shell atau file .env
      # (jangan di-commit). Compose menolak start jika salah satunya kosong.
      # Buat nilai acak yang unik untuk masing-masing: openssl rand -base64 48
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET wajib diisi, minimal 32 karakter dan unik}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET wajib diisi, minimal 32 karakter dan unik}
      - CSRF_SECRET=${CSRF_SECRET:?CSRF_SECRET wajib diisi, minimal 32 karakter dan unik}
      # Wajib true di production: cookie auth hanya dikirim lewat HTTPS.
      - COOKIE_SECURE=true
    restart: unless-stopped
